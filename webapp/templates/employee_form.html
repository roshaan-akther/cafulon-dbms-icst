{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block heading %}{{ title }}{% endblock %}
{% block content %}
<div class="card" style="max-width:640px">
    <div class="card-body p-3">
        <form method="post">
            <div class="row g-2">
                <div class="col-sm-4">
                    <label class="form-label">First Name</label>
                    <input name="FirstName" class="form-control" required value="{{ emp.FirstName if emp else '' }}">
                </div>
                <div class="col-sm-4">
                    <label class="form-label">Last Name</label>
                    <input name="LastName" class="form-control" required value="{{ emp.LastName if emp else '' }}">
                </div>
                <div class="col-sm-4">
                    <label class="form-label">Position</label>
                    <select name="Position" class="form-select" required>
                        {% for p in ['Manager','Assistant Manager','Head Chef','Sous Chef','Chef','Waiter','Hostess','Bartender','Cashier','Kitchen Helper','Security Guard','Cleaner'] %}
                        <option value="{{ p }}" {% if emp and emp.Position==p %}selected{% endif %}>{{ p }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-sm-4">
                    <label class="form-label">Phone</label>
                    <input name="Phone" class="form-control" required value="{{ emp.Phone if emp else '' }}">
                </div>
                <div class="col-sm-4">
                    <label class="form-label">Email</label>
                    <input name="Email" class="form-control" value="{{ emp.Email if emp else '' }}">
                </div>
                <div class="col-sm-4">
                    <label class="form-label">Salary</label>
                    <input name="Salary" type="number" step="0.01" class="form-control" required value="{{ emp.Salary if emp else '' }}">
                </div>
                <div class="col-sm-4">
                    <label class="form-label">Hire Date</label>
                    <input name="HireDate" type="date" class="form-control" required value="{{ emp.HireDate if emp else '' }}">
                </div>
                <div class="col-sm-4">
                    <label class="form-label">Shift</label>
                    <select name="Shift" class="form-select">
                        {% for s in ['Morning','Evening','Night'] %}
                        <option value="{{ s }}" {% if emp and emp.Shift==s %}selected{% endif %}>{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12 d-flex gap-2 pt-1">
                    <button class="btn btn-primary px-3"><i class="bi bi-check-lg"></i> {{ 'Update' if emp else 'Add' }}</button>
                    <a href="/employees" class="btn btn-soft">Cancel</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
