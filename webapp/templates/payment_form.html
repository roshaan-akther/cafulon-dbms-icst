{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block heading %}{{ title }}{% endblock %}
{% block content %}
<div class="card" style="max-width:480px">
    <div class="card-body p-3">
        <form method="post">
            <div class="row g-2">
                <div class="col-12">
                    <label class="form-label">Order</label>
                    <select name="OrderID" class="form-select" required>
                        <option value="">-- Select --</option>
                        {% for o in unpaid_orders %}
                        <option value="{{ o.OrderID }}">#{{ o.OrderID }} &middot; {{ o.Customer }} &middot; LKR {{ o.TotalAmount }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-sm-6">
                    <label class="form-label">Amount</label>
                    <input name="Amount" type="number" step="0.01" class="form-control" required>
                </div>
                <div class="col-sm-6">
                    <label class="form-label">Method</label>
                    <select name="PaymentMethod" class="form-select" required>
                        {% for m in ['Cash','Credit Card','Debit Card','Mobile Wallet','Bank Transfer'] %}
                        <option value="{{ m }}">{{ m }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">Reference <span class="text-muted fw-normal">(opt)</span></label>
                    <input name="TransactionReference" class="form-control">
                </div>
                <div class="col-12 d-flex gap-2 pt-1">
                    <button class="btn btn-primary px-3"><i class="bi bi-check-lg"></i> Record</button>
                    <a href="/payments" class="btn btn-soft">Cancel</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
