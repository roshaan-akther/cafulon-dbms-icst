{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block heading %}{{ title }}{% endblock %}
{% block content %}
<div class="card" style="max-width:640px">
    <div class="card-body p-3">
        <form method="post">
            <div class="row g-2">
                <div class="col-sm-4">
                    <label class="form-label">Category</label>
                    <select name="CategoryID" class="form-select" required>
                        {% for c in categories %}
                        <option value="{{ c.CategoryID }}" {% if item and item.CategoryID==c.CategoryID %}selected{% endif %}>{{ c.CategoryName }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-sm-4">
                    <label class="form-label">Item Name</label>
                    <input name="ItemName" class="form-control" required value="{{ item.ItemName if item else '' }}">
                </div>
                <div class="col-sm-4">
                    <label class="form-label">Price (LKR)</label>
                    <input name="Price" type="number" step="0.01" class="form-control" required value="{{ item.Price if item else '' }}">
                </div>
                <div class="col-sm-8">
                    <label class="form-label">Description</label>
                    <textarea name="Description" class="form-control" rows="2">{{ item.Description if item else '' }}</textarea>
                </div>
                <div class="col-sm-4">
                    <label class="form-label">Prep (min)</label>
                    <input name="PreparationTime" type="number" class="form-control" value="{{ item.PreparationTime if item else '' }}">
                </div>
                <div class="col-12 d-flex gap-2 pt-1">
                    <button class="btn btn-primary px-3"><i class="bi bi-check-lg"></i> {{ 'Update' if item else 'Add' }}</button>
                    <a href="/menu" class="btn btn-soft">Cancel</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
