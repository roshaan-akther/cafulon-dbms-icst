{% extends "base.html" %}
{% block title %}New Order{% endblock %}
{% block heading %}New Order{% endblock %}
{% block content %}

<form method="post" id="orderForm">
    <div class="card mb-2">
        <div class="card-body p-3">
            <div class="row g-2">
                <div class="col-sm-4">
                    <label class="form-label">Customer</label>
                    <select name="CustomerID" class="form-select">
                        <option value="">Walk-in</option>
                        {% for c in customers %}
                        <option value="{{ c.CustomerID }}">{{ c.FirstName }} {{ c.LastName }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-sm-4">
                    <label class="form-label">Employee *</label>
                    <select name="EmployeeID" class="form-select" required>
                        <option value="">-- Select --</option>
                        {% for e in employees %}
                        <option value="{{ e.EmployeeID }}">{{ e.FirstName }} {{ e.LastName }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-sm-2">
                    <label class="form-label">Table</label>
                    <select name="TableID" class="form-select">
                        <option value="">--</option>
                        {% for t in tables %}
                        <option value="{{ t.TableID }}">#{{ t.TableNumber }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-sm-2">
                    <label class="form-label">Type</label>
                    <select name="OrderType" class="form-select">
                        <option>Dine-In</option>
                        <option>Takeaway</option>
                        <option>Delivery</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header flex-between">
            Items
            <button type="button" class="btn btn-sm btn-soft" id="addRow"><i class="bi bi-plus-lg"></i></button>
        </div>
        <div class="table-wrap">
            <table class="table mb-0" id="itemsTable">
                <thead><tr><th style="min-width:220px">Item</th><th style="width:60px">Qty</th><th style="width:70px">Price</th><th style="width:80px">Sub</th><th style="width:28px"></th></tr></thead>
                <tbody>
                    <tr>
                        <td>
                            <select name="item_id[]" class="form-select form-select-sm item-select" style="font-size:.72rem">
                                <option value="">-- Select --</option>
                                {% for i in menu_items %}
                                <option value="{{ i.ItemID }}" data-price="{{ i.Price }}">{{ i.ItemName }} &middot; LKR {{ i.Price }}</option>
                                {% endfor %}
                            </select>
                        </td>
                        <td><input name="qty[]" type="number" min="1" value="1" class="form-control form-control-sm qty-input" style="font-size:.72rem"></td>
                        <td class="price-display text-xs text-muted align-middle">LKR 0</td>
                        <td class="subtotal-display fw-medium text-xs align-middle">LKR 0</td>
                        <td class="align-middle"><button type="button" class="btn btn-sm btn-ghost remove-row p-0" style="font-size:.6rem"><i class="bi bi-x-lg"></i></button></td>
                    </tr>
                </tbody>
                <tfoot class="table-footer">
                    <tr><td colspan="3" class="text-end fw-bold">Total</td><td class="fw-bold" id="grandTotal">LKR 0</td><td></td></tr>
                </tfoot>
            </table>
        </div>
    </div>

    <div class="d-flex gap-2 mt-2">
        <button type="submit" class="btn btn-primary px-3"><i class="bi bi-check-lg"></i> Create</button>
        <a href="/orders" class="btn btn-soft">Cancel</a>
    </div>
</form>

<script>
function cr(r){const s=r.querySelector('.item-select'),q=parseInt(r.querySelector('.qty-input').value)||0,o=s.selectedOptions[0],p=o?parseFloat(o.getAttribute('data-price'))||0:0,st=p*q;r.querySelector('.price-display').textContent='LKR '+p.toFixed(0);r.querySelector('.subtotal-display').textContent='LKR '+st.toFixed(0);return st}
function ct(){let t=0;document.querySelectorAll('#itemsTable tbody tr').forEach(r=>t+=cr(r));document.getElementById('grandTotal').textContent='LKR '+t.toFixed(0)}
document.querySelector('#itemsTable tbody').addEventListener('change',ct);document.querySelector('#itemsTable tbody').addEventListener('input',ct);
document.getElementById('addRow').addEventListener('click',function(){const b=document.querySelector('#itemsTable tbody'),c=b.querySelector('tr').cloneNode(true);c.querySelectorAll('select,input').forEach(e=>e.value='');c.querySelector('.qty-input').value=1;c.querySelector('.price-display').textContent='LKR 0';c.querySelector('.subtotal-display').textContent='LKR 0';b.appendChild(c)});
document.querySelector('#itemsTable tbody').addEventListener('click',function(e){if(e.target.closest('.remove-row')&&document.querySelectorAll('#itemsTable tbody tr').length>1){e.target.closest('tr').remove();ct()}});
ct();
</script>
{% endblock %}
